<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor DWF</title>
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --line: #d9dce2; --text: #1c1f24; --muted: #6a717d;
  --accent: #0a66d8; --accent-text: #ffffff; --hover: #eceef2; --active: #dfe7f5; --desk: #d3d6dc;
  --warn-bg: #fff6d8; --warn-text: #5a4500; --err-bg: #fde3e1; --err-text: #7a1410;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1d21; --surface: #24272c; --line: #363a42; --text: #e8eaee; --muted: #9aa1ad;
    --accent: #4c9bff; --accent-text: #0b1522; --hover: #2e3238; --active: #2b3a52; --desk: #15171a;
    --warn-bg: #3d3414; --warn-text: #f3e2a4; --err-bg: #4a1f1c; --err-text: #ffd0cc;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; background: var(--bg); color: var(--text);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
  overflow: hidden; -webkit-user-select: none; user-select: none;
}
[hidden] { display: none !important; }
.muted { color: var(--muted); }

.bar {
  display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 46px;
  background: var(--surface); border-bottom: 1px solid var(--line); flex: none;
}
.doc { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; }
.file { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sheetCount { white-space: nowrap; }
.tools { display: flex; align-items: center; gap: 6px; flex: none; }
body:not(.has-doc) .tools, body:not(.has-doc) .status > * { visibility: hidden; }
.group { display: flex; align-items: center; gap: 2px; }
.zoom { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }

.btn {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
  border-radius: 7px; padding: 5px 11px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn:focus-visible, .sheet:focus-visible, .link:focus-visible, .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.icon { width: 30px; padding: 5px 0; font-size: 15px; line-height: 1.1; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { padding: 9px 20px; font-size: 14px; }
.btn.toggle[aria-pressed="true"] { background: var(--active); border-color: var(--accent); }

.main { flex: 1; display: flex; min-height: 0; }
.side {
  width: 196px; flex: none; background: var(--surface); border-right: 1px solid var(--line);
  overflow-y: auto; display: none;
}
body.has-doc:not(.single) .side { display: block; }
.sheets { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.sheet {
  font: inherit; color: inherit; text-align: left; background: none; border: 1px solid transparent;
  border-radius: 8px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 5px;
}
.sheet:hover { background: var(--hover); }
.sheet.active { background: var(--active); border-color: var(--accent); }
.thumb {
  display: flex; align-items: center; justify-content: center; height: 104px; border-radius: 4px;
  background: #fff; border: 1px solid var(--line); color: #9aa1ad; font-size: 20px; overflow: hidden;
}
.thumb img { max-width: 100%; max-height: 100%; display: block; }
.label { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.num { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.stage { flex: 1; position: relative; min-width: 0; background: var(--desk); cursor: grab; touch-action: none; }
.stage.dragging { cursor: grabbing; }
body:not(.has-doc) .stage { cursor: default; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
body:not(.has-doc) #canvas { display: none; }

.welcome { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
body.has-doc .welcome { display: none; }
.drop {
  max-width: 420px; width: 100%; text-align: center; padding: 36px 28px; border: 2px dashed var(--line);
  border-radius: 16px; background: var(--surface); color: var(--muted);
}
.drop svg { color: var(--accent); }
.drop h1 { margin: 10px 0 6px; font-size: 22px; color: var(--text); letter-spacing: -.01em; }
.drop p { margin: 0 0 18px; font-size: 14px; }
.drop strong { color: var(--text); }
.drop .hint { margin: 18px 0 0; font-size: 12px; }

.notice, .error {
  position: absolute; left: 50%; transform: translateX(-50%); max-width: min(680px, calc(100% - 24px));
  display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px 8px 14px; border-radius: 9px;
  box-shadow: 0 4px 18px rgba(0,0,0,.18); -webkit-user-select: text; user-select: text; cursor: default; z-index: 3;
}
.notice { top: 12px; background: var(--warn-bg); color: var(--warn-text); }
.error { bottom: 16px; background: var(--err-bg); color: var(--err-text); }
.x { font: inherit; font-size: 17px; line-height: 1; background: none; border: 0; color: inherit; cursor: pointer; padding: 1px 4px; border-radius: 4px; flex: none; }

.dropmask {
  position: absolute; inset: 10px; border: 3px dashed var(--accent); border-radius: 14px; display: none;
  align-items: center; justify-content: center; background: color-mix(in srgb, var(--accent) 14%, transparent);
  font-size: 18px; font-weight: 600; color: var(--text); pointer-events: none; z-index: 4;
}
body.dropping .dropmask { display: flex; }
.spinner {
  position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px; border-radius: 50%;
  border: 3px solid var(--line); border-top-color: var(--accent); display: none; z-index: 5;
}
body.busy .spinner { display: block; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { body.busy .spinner { animation-duration: 2.4s; } }

.panel { width: 220px; flex: none; background: var(--surface); border-left: 1px solid var(--line); display: none; flex-direction: column; min-height: 0; }
body.show-layers.has-doc .panel { display: flex; }
.panel-head { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.link { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.layers { overflow-y: auto; padding: 6px 8px; }
.layer { display: flex; align-items: center; gap: 7px; padding: 4px; border-radius: 5px; cursor: pointer; }
.layer:hover { background: var(--hover); }
.layer span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.status {
  display: flex; align-items: center; gap: 10px; padding: 4px 12px; min-height: 26px; flex: none;
  background: var(--surface); border-top: 1px solid var(--line); font-size: 12px;
}
.status .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status .muted { white-space: nowrap; }
.spacer { flex: 1; }
.coords { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }

@media (max-width: 860px) {
  .side { width: 132px; }
  .thumb { height: 70px; }
  #btnWeights, #btnExport { display: none; }
  .panel { position: absolute; right: 0; top: 0; bottom: 0; z-index: 6; box-shadow: -6px 0 20px rgba(0,0,0,.2); }
  .main { position: relative; }
}
@media (max-width: 560px) {
  body.has-doc:not(.single) .side { display: none; }
  #btnDark, .zoom { display: none; }
}

</style>
</head>
<body>
<header class="bar">
  <button id="btnOpen" class="btn primary" type="button" title="Abrir archivo (Ctrl+O / ⌘O)">Abrir…</button>
  <div class="doc">
    <span id="fileName" class="file"></span>
    <span id="sheetCount" class="muted"></span>
  </div>
  <div class="tools">
    <div class="group" role="group" aria-label="Zoom">
      <button id="btnZoomOut" class="btn icon" type="button" title="Alejar (−)" aria-label="Alejar">−</button>
      <span id="zoomLabel" class="zoom" aria-live="off"></span>
      <button id="btnZoomIn" class="btn icon" type="button" title="Acercar (+)" aria-label="Acercar">+</button>
    </div>
    <button id="btnFit" class="btn" type="button" title="Ajustar a la ventana (0)">Ajustar</button>
    <button id="btnWeights" class="btn toggle" type="button" aria-pressed="true" title="Mostrar los grosores de línea del plano">Grosores</button>
    <button id="btnDark" class="btn toggle" type="button" aria-pressed="false" title="Ver el plano sobre fondo oscuro">Fondo oscuro</button>
    <button id="btnLayers" class="btn toggle" type="button" aria-pressed="false" title="Mostrar u ocultar capas">Capas</button>
    <button id="btnExport" class="btn" type="button" title="Guardar la hoja actual como imagen PNG">Exportar PNG</button>
  </div>
</header>

<main class="main">
  <nav id="sidebar" class="side" aria-label="Hojas">
    <div id="sheets" class="sheets"></div>
  </nav>

  <section id="stage" class="stage">
    <canvas id="canvas"></canvas>

    <div id="welcome" class="welcome">
      <div class="drop">
        <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><path d="M14 6h24l12 12v40H14z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M38 6v12h12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M22 46l8-12 6 8 4-5 4 9z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <h1>Visor DWF</h1>
        <p>Arrastrá un archivo <strong>.dwf</strong> a esta ventana<br>o elegilo desde tu computadora.</p>
        <button id="btnOpenBig" class="btn primary big" type="button">Elegir archivo…</button>
        <p class="hint">El archivo se abre localmente en tu navegador. No se sube a ningún servidor.</p>
      </div>
    </div>

    <div id="notice" class="notice" hidden>
      <span id="noticeText"></span>
      <button id="noticeClose" class="x" type="button" aria-label="Cerrar aviso">×</button>
    </div>
    <div id="error" class="error" role="alert" hidden>
      <span id="errorText"></span>
      <button id="errorClose" class="x" type="button" aria-label="Cerrar">×</button>
    </div>
    <div class="dropmask"><span>Soltá el archivo para abrirlo</span></div>
    <div class="spinner" aria-hidden="true"></div>
  </section>

  <aside id="layerPanel" class="panel" aria-label="Capas">
    <div class="panel-head">
      <strong>Capas</strong>
      <span>
        <button id="layersAll" class="link" type="button">Todas</button>
        <button id="layersNone" class="link" type="button">Ninguna</button>
      </span>
    </div>
    <div id="layers" class="layers"></div>
  </aside>
</main>

<footer class="status">
  <span id="sheetTitle" class="title"></span>
  <span id="sheetInfo" class="muted"></span>
  <span class="spacer"></span>
  <span id="coords" class="coords"></span>
</footer>

<input id="file" type="file" accept=".dwf,.w2d,.DWF,.W2D" hidden>

  function fit() {
    var sh = state.sheet; if (!sh) return;
    var r = stage.getBoundingClientRect(), e = fitRect(sh), pad = sh.paper ? 28 : 20;
    var w = Math.max(e[2] - e[0], 1e-9), h = Math.max(e[3] - e[1], 1e-9);
    var sc = Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h);
    if (!(sc > 0) || !isFinite(sc)) sc = 1;
    state.view.scale = sc; state.fitScale = sc;
    state.view.ox = r.width / 2 - (e[0] + w / 2) * sc;
    state.view.oy = r.height / 2 + (e[1] + h / 2) * sc;
    requestDraw();
  }
  function zoomAt(factor, px, py) {
    var v = state.view, min = (state.fitScale || 1) / 20, max = (state.fitScale || 1) * 4000;
    var ns = Math.min(max, Math.max(min, v.scale * factor)), f = ns / v.scale;
    v.ox = px - (px - v.ox) * f; v.oy = py - (py - v.oy) * f; v.scale = ns;
    requestDraw();
  }
  function zoomCenter(f) { var r = stage.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); }
  function zoomText() {
    var sh = state.sheet; if (!sh) return '';
    if (sh.paper) {
      var perInch = sh.paper.units === 'mm' ? 25.4 : 1;
      return Math.round(state.view.scale * perInch / 96 * 100) + ' %';
    }
    return Math.round(state.view.scale / (state.fitScale || 1) * 100) + ' %';
  }

  // ───────────────────────────── Interacción ─────────────────────────────
  var drag = null;
  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 && e.button !== 1) return;
    if (!state.sheet) return;
    drag = { x: e.clientX, y: e.clientY, ox: state.view.ox, oy: state.view.oy };
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove', function (e) {
    if (drag) {
      state.view.ox = drag.ox + (e.clientX - drag.x); state.view.oy = drag.oy + (e.clientY - drag.y);
      requestDraw();
    }
    updateCoords(e);
  });
  function endDrag() { drag = null; stage.classList.remove('dragging'); }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('pointerleave', function () { $('coords').textContent = ''; });
  stage.addEventListener('wheel', function (e) {
    if (!state.sheet) return;
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    if (e.shiftKey && !e.ctrlKey && !e.metaKey) {
      state.view.ox -= e.deltaX || e.deltaY; state.view.oy -= e.deltaX ? e.deltaY : 0; requestDraw(); return;
    }
    var dy = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
    var k = e.ctrlKey ? 0.01 : 0.0022;       // ctrl = gesto de pellizco en trackpad
    zoomAt(Math.exp(-Math.max(-150, Math.min(150, dy)) * k), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  // Pellizco en Safari
  var gestureScale = 1;
  stage.addEventListener('gesturestart', function (e) { e.preventDefault(); gestureScale = 1; });
  stage.addEventListener('gesturechange', function (e) {
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    zoomAt(e.scale / gestureScale, e.clientX - r.left, e.clientY - r.top);
    gestureScale = e.scale;
  });
  stage.addEventListener('dblclick', function (e) {
    var r = stage.getBoundingClientRect(); zoomAt(e.altKey ? 0.5 : 2, e.clientX - r.left, e.clientY - r.top);
  });

  function updateCoords(e) {
    var sh = state.sheet; if (!sh) return;
    var r = stage.getBoundingClientRect(), v = state.view;
    var wx = (e.clientX - r.left - v.ox) / v.scale, wy = -(e.clientY - r.top - v.oy) / v.scale;
    var txt;
    if (sh.paper) {
      var u = sh.paper.units === 'mm' ? 'mm' : sh.paper.units === 'in' ? 'in' : sh.paper.units;
      var dec = u === 'mm' ? 1 : 3;
      txt = 'X ' + wx.toFixed(dec) + '  Y ' + wy.toFixed(dec) + ' ' + u;
    } else txt = 'X ' + Math.round(wx) + '  Y ' + Math.round(wy);
    $('coords').textContent = txt;
  }

  window.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var mod = e.metaKey || e.ctrlKey;
    if (mod && (e.key === 'o' || e.key === 'O')) { e.preventDefault(); $('file').click(); return; }
    if (!state.sheet) return;
    var step = 80;
    switch (e.key) {
      case '+': case '=': e.preventDefault(); zoomCenter(1.3); break;
      case '-': case '_': e.preventDefault(); zoomCenter(1 / 1.3); break;
      case '0': case 'f': case 'F': if (!mod || e.key === '0') { e.preventDefault(); fit(); } break;
      case 'ArrowLeft': state.view.ox += step; requestDraw(); break;
      case 'ArrowRight': state.view.ox -= step; requestDraw(); break;
      case 'ArrowUp': state.view.oy += step; requestDraw(); break;
      case 'ArrowDown': state.view.oy -= step; requestDraw(); break;
      case 'PageDown': case ']': e.preventDefault(); showSheet(state.sheetIndex + 1); break;
      case 'PageUp': case '[': e.preventDefault(); showSheet(state.sheetIndex - 1); break;
    }
  });
  new ResizeObserver(function () { if (state.sheet) requestDraw(); }).observe(stage);

  // ───────────────────────────── Archivos ─────────────────────────────
  function showError(msg) {
    $('errorText').textContent = msg;
    $('error').hidden = false;
  }
  $('errorClose').addEventListener('click', function () { $('error').hidden = true; });

  function openFile(file) {
    if (!file) return;
    $('error').hidden = true;
    document.body.classList.add('busy');
    var reader = new FileReader();
    reader.onerror = function () { document.body.classList.remove('busy'); showError('No se pudo leer el archivo.'); };
    reader.onload = function () {
      setTimeout(function () {
        try {
          loadBytes(new Uint8Array(reader.result), file.name);
        } catch (err) {
          console.error(err);
          showError((err && err.message) || 'No se pudo abrir el archivo.');
        }
        document.body.classList.remove('busy');
      }, 20);
    };
    reader.readAsArrayBuffer(file);
  }

  function loadBytes(bytes, name) {
    var doc = Core.openDWF(bytes, name);
    state.doc = doc; state.fileName = name; state.cache = {}; state.sheet = null; state.sheetIndex = -1;
    document.title = name + ' — Visor DWF';
    $('fileName').textContent = name;
    document.body.classList.add('has-doc');
    buildSheetList();
    var first = 0;
    for (var i = 0; i < doc.sheets.length; i++) if (doc.sheets[i].kind === '2d') { first = i; break; }
    showSheet(first);
  }

  function buildSheetList() {
    var list = $('sheets'); list.textContent = '';
    var doc = state.doc;
    doc.sheets.forEach(function (s, i) {
      var b = document.createElement('button');
      b.className = 'sheet'; b.type = 'button'; b.dataset.i = i;
      var th = document.createElement('span'); th.className = 'thumb';
      var t = doc.thumbnail ? doc.thumbnail(i) : null;
      if (t) {
        var img = document.createElement('img'); img.alt = '';
        img.src = URL.createObjectURL(new Blob([t.data], { type: t.mime }));
        th.appendChild(img);
      } else th.textContent = s.kind === '3d' ? '3D' : (i + 1);
      var lab = document.createElement('span'); lab.className = 'label';
      var num = document.createElement('span'); num.className = 'num'; num.textContent = (i + 1);
      var nm = document.createElement('span'); nm.className = 'name'; nm.textContent = s.title; nm.title = s.title;
      lab.appendChild(num); lab.appendChild(nm);
      b.appendChild(th); b.appendChild(lab);
      b.addEventListener('click', function () { showSheet(i); });
      list.appendChild(b);
    });
    document.body.classList.toggle('single', doc.sheets.length < 2);
    $('sheetCount').textContent = doc.sheets.length === 1 ? '1 hoja' : doc.sheets.length + ' hojas';
  }

  function showSheet(i) {
    var doc = state.doc;
    if (!doc || i < 0 || i >= doc.sheets.length) return;
    var sh = state.cache[i];
    if (!sh) {
      try { sh = state.cache[i] = doc.loadSheet(i); }
      catch (err) { console.error(err); showError('No se pudo leer la hoja «' + doc.sheets[i].title + '»: ' + err.message); return; }
    }
    state.sheetIndex = i; state.sheet = sh; state.hidden = {};
    Array.prototype.forEach.call($('sheets').children, function (b, k) {
      b.classList.toggle('active', k === i);
      if (k === i && b.scrollIntoView) b.scrollIntoView({ block: 'nearest' });
    });
    buildLayerList(sh);
    var notes = [];
    if (sh.kind === '3d') notes.push('Esta hoja contiene un modelo 3D, que este visor no puede mostrar (solo planos 2D).');
    else if (!sh.layers.length || !sh.extent) notes.push('Esta hoja no contiene dibujo 2D.');
    sh.warnings.forEach(function (w) { notes.push(w); });
    var un = Object.keys(sh.unsupported);
    if (un.length) notes.push('Elementos no mostrados: ' + un.map(function (k) { return k + ' (' + sh.unsupported[k] + ')'; }).join(', ') + '.');
    $('notice').hidden = !notes.length;
    $('noticeText').textContent = notes.join(' ');
    $('sheetTitle').textContent = sh.title;
    var info = [];
    if (sh.paper) info.push(fmtPaper(sh.paper));
    $('sheetInfo').textContent = info.join(' · ');
    fit();
    draw();
  }
  function fmtPaper(p) {
    var mm = p.units === 'mm' ? 1 : p.units === 'in' ? 25.4 : 0;
    if (!mm) return p.width.toFixed(1) + ' × ' + p.height.toFixed(1) + ' ' + p.units;
    var w = p.width * mm, h = p.height * mm;
    var sizes = { A0: [841, 1189], A1: [594, 841], A2: [420, 594], A3: [297, 420], A4: [210, 297], Carta: [215.9, 279.4], Oficio: [215.9, 355.6], 'ANSI B': [279.4, 431.8], 'ANSI C': [431.8, 558.8], 'ANSI D': [558.8, 863.6], 'ANSI E': [863.6, 1117.6], 'Arch D': [609.6, 914.4], 'Arch E': [914.4, 1219.2] };
    var lo = Math.min(w, h), hi = Math.max(w, h), name = '';
    for (var k in sizes) if (Math.abs(sizes[k][0] - lo) < 2.5 && Math.abs(sizes[k][1] - hi) < 2.5) { name = k + ' · '; break; }
    return name + Math.round(w) + ' × ' + Math.round(h) + ' mm';
  }

  function buildLayerList(sh) {
    var box = $('layers'); box.textContent = '';
    var layers = sh.layers.length && sh.layers[0].data ? sh.layers[0].data.layers : [];
    $('btnLayers').disabled = !layers.length;
    if (!layers.length) { document.body.classList.remove('show-layers'); return; }
    layers.forEach(function (L) {
      var lab = document.createElement('label'); lab.className = 'layer';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
      cb.addEventListener('change', function () { state.hidden[L.id] = !cb.checked; requestDraw(); });
      var sp = document.createElement('span'); sp.textContent = L.name; sp.title = L.name;
      lab.appendChild(cb); lab.appendChild(sp);
      box.appendChild(lab);
    });
  }
  function setAllLayers(on) {
    Array.prototype.forEach.call($('layers').querySelectorAll('input'), function (cb) {
      if (cb.checked !== on) { cb.checked = on; cb.dispatchEvent(new Event('change')); }
    });
  }

  // ───────────────────────────── Exportar ─────────────────────────────
  function exportPNG() {
    var sh = state.sheet; if (!sh) return;
    var e = fitRect(sh), w = e[2] - e[0], h = e[3] - e[1];
    var maxSide = 6000, sc = maxSide / Math.max(w, h);
    if (sh.paper) { var dpi = 200, perUnit = sh.paper.units === 'mm' ? dpi / 25.4 : dpi; sc = Math.min(sc, perUnit); }
    var W = Math.max(1, Math.round(w * sc)), H = Math.max(1, Math.round(h * sc));
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var view = { scale: sc, ox: -e[0] * sc, oy: e[3] * sc };
    renderSheet(cv.getContext('2d'), sh, view, W, H, 1, { transparentDesk: true });
    setBackground(sheetBackground(sh));
    cv.toBlob(function (blob) {
      if (!blob) { showError('No se pudo generar la imagen.'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (state.fileName.replace(/\.[^.]+$/, '') + ' - ' + sh.title).replace(/[\\/:*?"<>|]+/g, '_') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    }, 'image/png');
    requestDraw();
  }

  // ───────────────────────────── Controles ─────────────────────────────
  $('file').addEventListener('change', function () { openFile(this.files[0]); this.value = ''; });
  ['btnOpen', 'btnOpenBig'].forEach(function (id) { $(id).addEventListener('click', function () { $('file').click(); }); });
  $('btnZoomIn').addEventListener('click', function () { zoomCenter(1.4); });
  $('btnZoomOut').addEventListener('click', function () { zoomCenter(1 / 1.4); });
  $('btnFit').addEventListener('click', fit);
  $('btnDark').addEventListener('click', function () {
    state.dark = !state.dark; this.setAttribute('aria-pressed', state.dark); requestDraw();
  });
  $('btnWeights').addEventListener('click', function () {
    state.weights = !state.weights; this.setAttribute('aria-pressed', state.weights); requestDraw();
  });
  $('btnLayers').addEventListener('click', function () {
    var on = document.body.classList.toggle('show-layers'); this.setAttribute('aria-pressed', on);
  });
  $('btnExport').addEventListener('click', exportPNG);
  $('layersAll').addEventListener('click', function () { setAllLayers(true); });
  $('layersNone').addEventListener('click', function () { setAllLayers(false); });
  $('noticeClose').addEventListener('click', function () { $('notice').hidden = true; });

  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; document.body.classList.add('dropping'); });
  window.addEventListener('dragleave', function () { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dropping'); } });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dropping');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) openFile(f);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', requestDraw);

  // Para pruebas automáticas
  window.VisorDWF = { loadBytes: loadBytes, state: state, fit: fit, showSheet: showSheet, draw: draw };
})();

</script>
</body>
</html>
